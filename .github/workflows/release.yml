name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: sign and publish
        env:
          GH_TOKEN: ${{ github.token }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          export VERSION="$version"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("manifest.json")
          data = json.loads(path.read_text())
          data["version"] = os.environ["VERSION"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          mkdir -p dist
          cp manifest.json background.js content.js content.css popup.html popup.js popup.css icon.svg dist/
          npm install -g web-ext
          web-ext sign \
            --source-dir dist \
            --artifacts-dir web-ext-artifacts \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
          archive="ModalFox-${version}.xpi"
          mv web-ext-artifacts/*.xpi "$archive"
          gh release create "$GITHUB_REF_NAME" "$archive" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
